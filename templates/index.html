<!doctype html><html><body style="font-family:Arial;max-width:800px;margin:40px auto"><h1>ML Anomaly Detector</h1><p>Enter numeric observations separated by commas.</p><input id="v" value="10,11,10,12,11,200,10"><button onclick="run()">Detect</button><pre id="o"></pre><script>async function run(){let values=v.value.split(',').map(Number);let r=await fetch('/api/detect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({values})});o.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
